name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node scripts/release-plugin.mjs
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION="$(node -p "require('./packages/local-plugin/package.json').version")"
          if npm view "dsh-remote-local-plugin@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm tarball
        if: steps.published.outputs.exists != 'true'
        run: npm publish packages/local-plugin/dsh-remote-local-plugin-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: packages/local-plugin/dsh-remote-local-plugin-*.tgz
