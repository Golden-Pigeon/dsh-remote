name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing
        run: npm install --global npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node scripts/release-plugin.mjs
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./packages/local-plugin/package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION="$(node -p "require('./packages/local-plugin/package.json').version")"
          if npm view "dsh-remote-local-plugin@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether the remote agent version is already published
        id: agent-published
        run: |
          VERSION="$(node -p "require('./packages/remote-agent/package.json').version")"
          if npm view "@goldenpigeon/dsh-remote-agent@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage remote agent tarball
        if: steps.agent-published.outputs.exists != 'true'
        run: |
          npm stage publish packages/local-plugin/assets/goldenpigeon-dsh-remote-agent-*.tgz --tag latest --access public --provenance
          echo "::notice::Remote agent staged. Approve it with 2FA: npm stage list @goldenpigeon/dsh-remote-agent"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Stage local plugin tarball
        if: steps.published.outputs.exists != 'true'
        run: |
          npm stage publish packages/local-plugin/dsh-remote-local-plugin-*.tgz --tag latest --access public --provenance
          echo "::notice::npm package staged. Approve it with 2FA: npm stage list dsh-remote-local-plugin && npm stage approve <stage-id>"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            packages/local-plugin/dsh-remote-local-plugin-*.tgz
            packages/local-plugin/assets/goldenpigeon-dsh-remote-agent-*.tgz
