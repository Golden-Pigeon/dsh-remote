name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: pr-intent
    attributes:
      label: Do you intend to submit a PR?
      description: This helps maintainers discuss the approach before code review.
      options:
        - "Yes"
        - "No"
        - "Not sure yet"
    validations:
      required: true
